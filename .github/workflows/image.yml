name: Image

# Builds the container image for amd64 and arm64, each on its own runner, runs
# the test suite inside it and renders examples/demo through the action with it
# (the videos are kept as artifacts). Pushes to main and release tags then
# publish both platforms as one image, ghcr.io/bricef/narrate, and a release
# moves its major tag, v0 for v0.2.0, once the image has passed.
on:
  push:
    branches: ["**"]
    # Releases and pre-releases (v0.2.0, v0.3.0-rc.1), not the major tags this
    # workflow moves (v0)
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - examples/**
      - skills/**
      - action.yml
      - .github/workflows/image.yml
  # Pull requests from forks that change the image or the action; this
  # repository's own branches are built on push
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - action.yml
      - .github/workflows/image.yml
  workflow_dispatch:

jobs:
  image:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # Natively, not under QEMU, which would take hours to compile ffmpeg (#91)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # A cache scope per platform, so neither build evicts the other's layers.
      # Only main writes it: branches read main's, and the repository's 10 GB
      # of Actions cache holds main's two platforms rather than every branch's.
      - name: Run the tests in the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      # The runtime stage, not the last one (test): it is what's published (#88)
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: narrate:ci
          cache-from: type=gha,scope=${{ matrix.arch }}

      # As the README runs it: the current folder at /work, where the image
      # starts, a new cache volume and your own user, rather than the action's -w
      - name: Run it as the README does
        run: |
          mkdir "$RUNNER_TEMP/readme" && cd "$RUNNER_TEMP/readme"
          printf '# Hello\n\nThis video was made the way the README says.\n' > script.md
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -v narrate-cache:/cache \
              narrate:ci build script.md --tts silent
          test -O script.mp4
          test -O script.jpg

      - id: video
        name: Render the demo with it
        uses: ./
        with:
          image: narrate:ci
          source-path: examples/demo/demo.md
          output: out/demo.mp4
          tts: kokoro

      - uses: actions/upload-artifact@v7
        with:
          name: demo-video-${{ matrix.arch }}
          path: |
            ${{ steps.video.outputs.video-file }}
            ${{ steps.video.outputs.poster-file }}

      - id: meta
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}

      - if: steps.meta.outcome == 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # By digest, untagged: the publish job tags both platforms together once
      # both have passed
      - id: push
        name: Push the image by digest
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/${{ github.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export the digest
        if: steps.push.outcome == 'success'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - if: steps.push.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One image for both platforms, under the tags below
  publish:
    needs: image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Only the newest release of a series moves its tags, 0 and 0.2 for
      # v0.2.0, so re-running an older release's workflow leaves them alone
      - id: release
        name: Which tags move
        run: python3 scripts/release_tags.py newest "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        env:
          # The package page reads a multi-platform image's description from its index
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          # Only main moves latest, not release tags too. metadata-action
          # makes 0 for {{major}} on 0.x, though its README suggests turning
          # that off; a pre-release makes only its own version, 0.3.0-rc.1.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.release.outputs.newest-minor }}
            type=semver,pattern={{major}},enable=${{ steps.release.outputs.newest-major }}
            type=sha

      - id: index
        name: Publish the image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          # Every tag and annotation, then each platform's image by its digest
          mapfile -t args < <(jq -r '(.tags[] | "--tag=" + .), (.annotations[] | "--annotation=" + .)' \
              <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/index.json" "${args[@]}"
          index=$(jq -r '."containerimage.descriptor".digest' "$RUNNER_TEMP/index.json")
          docker buildx imagetools inspect "$IMAGE@$index"
          echo "digest=$index" >> "$GITHUB_OUTPUT"

  # What other repositories do: pull the published image from ghcr.io with the
  # workflow's token, and build with it through the action, on each platform
  published:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Render the demo with the published image
        uses: ./
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
          source-path: examples/demo/demo.md
          output: out/demo.mp4
          tts: kokoro

  # Moves the release's major tag, v0 for v0.2.0, so that `uses: bricef/narrate@v0`
  # runs it, with the image 0. Only the newest release of a series moves it, and
  # one at a time, so it never goes back.
  major-tag:
    needs: published
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: major-tag
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Move the major tag
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/release_tags.py move "$GITHUB_REF_NAME" "$GITHUB_SHA"
