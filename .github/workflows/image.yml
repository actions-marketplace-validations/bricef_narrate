name: Image

# Builds the container image, runs the test suite inside it and renders
# examples/demo through the action with it (the video is kept as an artifact).
# Pushes to main and v* tags then publish it as ghcr.io/bricef/narrate.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - examples/**
      - skills/**
      - action.yml
      - .github/workflows/image.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Run the tests in the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The runtime stage, not the last one (test): it is what's published (#88)
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: narrate:ci
          cache-from: type=gha

      # As the README runs it: the current folder at /work, where the image
      # starts, a new cache volume and your own user, rather than the action's -w
      - name: Run it as the README does
        run: |
          mkdir "$RUNNER_TEMP/readme" && cd "$RUNNER_TEMP/readme"
          printf '# Hello\n\nThis video was made the way the README says.\n' > script.md
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -v narrate-cache:/cache \
              narrate:ci build script.md --tts silent
          test -O script.mp4
          test -O script.jpg

      - id: video
        name: Render the demo with it
        uses: ./
        with:
          image: narrate:ci
          source-path: examples/demo/demo.md
          output: out/demo.mp4
          tts: kokoro

      - uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: |
            ${{ steps.video.outputs.video-file }}
            ${{ steps.video.outputs.poster-file }}

      - id: meta
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - if: steps.meta.outcome == 'success'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: publish
        name: Publish the image
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # What other repositories do: pull the published image from ghcr.io with the
  # workflow's token, and build with it through the action
  published:
    needs: image
    if: needs.image.outputs.digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Render the demo with the published image
        uses: ./
        with:
          image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
          source-path: examples/demo/demo.md
          output: out/demo.mp4
          tts: kokoro
