name: narrate
description: Build a narrated video from a Markdown script (Narakeet format) on the runner, with narrate
branding:
  icon: video
  color: blue

inputs:
  source-path:
    description: Path of the main script in the repository, or of a .zip project
    required: true
  output:
    description: Where to write the video (the poster and subtitles go next to it)
    default: narrate/result.mp4
  tts:
    description: "Speech engine: auto (ElevenLabs when a key is given, else Kokoro), kokoro, elevenlabs or silent"
    default: auto
  elevenlabs-api-key:
    description: ElevenLabs API key, e.g. from a secret (optional)
    default: ""

outputs:
  video-file:
    description: The video (MP4)
    value: ${{ steps.build.outputs.video-file }}
  poster-file:
    description: The poster image (JPG)
    value: ${{ steps.build.outputs.poster-file }}
  srt-file:
    description: Subtitles (SRT), when the script asks for subtitle files
    value: ${{ steps.build.outputs.srt-file }}
  vtt-file:
    description: Subtitles (VTT), when the script asks for subtitle files
    value: ${{ steps.build.outputs.vtt-file }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10

    # hashFiles() can't read the action's own directory when another repository
    # uses it, so the key comes from a shell step: the files pinning ffmpeg, the
    # models and the music, and uv.lock for Playwright's Chromium.
    - name: Cache keys
      id: keys
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        echo "tools=$(cat uv.lock src/narrate/{media,tts,stt,music}.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache tools (ffmpeg, models, music, Chromium)
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/narrate-tools
          ~/.cache/ms-playwright
        key: narrate-tools-${{ runner.os }}-${{ steps.keys.outputs.tools }}

    # Speech grows with every script, so each run saves a new entry seeded from the last
    - name: Cache synthesised speech
      uses: actions/cache@v6
      with:
        path: ~/.cache/narrate-speech
        key: narrate-speech-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: narrate-speech-${{ runner.os }}-

    - name: Install narrate and headless Chromium
      shell: bash
      run: |
        uv sync --project "$GITHUB_ACTION_PATH" --frozen
        uv run --project "$GITHUB_ACTION_PATH" playwright install --with-deps chromium

    - name: Build the video
      id: build
      shell: bash
      env:
        ELEVENLABS_API_KEY: ${{ inputs.elevenlabs-api-key }}
        SOURCE: ${{ inputs.source-path }}
        OUTPUT: ${{ inputs.output }}
        TTS: ${{ inputs.tts }}
      run: |
        export NARRATE_TOOLS="$HOME/.cache/narrate-tools" NARRATE_CACHE="$HOME/.cache/narrate-speech"
        mkdir -p "$(dirname "$OUTPUT")"
        uv run --project "$GITHUB_ACTION_PATH" narrate build "$SOURCE" -o "$OUTPUT" --tts "$TTS"
        base="${OUTPUT%.*}"
        echo "video-file=$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "poster-file=$base.jpg" >> "$GITHUB_OUTPUT"
        if [ -f "$base.srt" ]; then echo "srt-file=$base.srt" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$base.vtt" ]; then echo "vtt-file=$base.vtt" >> "$GITHUB_OUTPUT"; fi
