name: narrate
description: Build a narrated video from a Markdown script (Narakeet format) on the runner, with narrate
branding:
  icon: video
  color: blue

inputs:
  source-path:
    description: Path of the main script in the repository, or of a .zip project
    required: true
  output:
    description: Where to write the video (the poster and subtitles go next to it)
    default: narrate/result.mp4
  tts:
    description: "Speech engine: auto (ElevenLabs when a key is given, else Kokoro), kokoro, elevenlabs or silent"
    default: auto
  elevenlabs-api-key:
    description: ElevenLabs API key, e.g. from a secret (optional)
    default: ""
  subtitles:
    description: "Subtitles for this build, over the script's own: none, external, embed, overlay, overlay-background or tiktok (every mode but none also writes .srt and .vtt)"
    default: ""
  transcript:
    description: "true to also write what's spoken as plain text (<output>.transcript.txt)"
    default: "false"
  image:
    description: The narrate container image to build with
    default: ghcr.io/bricef/narrate:latest

outputs:
  video-file:
    description: The video (MP4)
    value: ${{ steps.build.outputs.video-file }}
  poster-file:
    description: The poster image (JPG)
    value: ${{ steps.build.outputs.poster-file }}
  srt-file:
    description: Subtitles (SRT), when the script asks for subtitle files
    value: ${{ steps.build.outputs.srt-file }}
  vtt-file:
    description: Subtitles (VTT), when the script asks for subtitle files
    value: ${{ steps.build.outputs.vtt-file }}
  transcript-file:
    description: What's spoken, as plain text, when a transcript is asked for
    value: ${{ steps.build.outputs.transcript-file }}

runs:
  using: composite
  steps:
    # hashFiles() can't read the action's own directory when another repository
    # uses it, so the key comes from a shell step: the files that pin the models
    # and the music narrate fetches or makes on first use.
    - name: Cache keys
      id: keys
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        echo "tools=$(cat src/narrate/{tts,stt,music}.py | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Cache models and music
      uses: actions/cache@v6
      with:
        path: ~/.cache/narrate-image/tools
        key: narrate-image-tools-${{ runner.os }}-${{ steps.keys.outputs.tools }}

    # Speech grows with every script, so each run saves a new entry seeded from the last
    - name: Cache synthesised speech
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/narrate-image/tts
          ~/.cache/narrate-image/stt
        key: narrate-image-speech-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: narrate-image-speech-${{ runner.os }}-

    # Images on ghcr.io are pulled with the workflow's token, so a private
    # package works for repositories it grants access to (needs packages: read)
    - name: Pull the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TOKEN: ${{ github.token }}
      run: |
        case "$IMAGE" in
          */*) ;;
          *) exit 0 ;;  # a local image, e.g. one built earlier in the job
        esac
        export DOCKER_CONFIG="$(mktemp -d)"
        trap 'rm -rf "$DOCKER_CONFIG"' EXIT
        if [[ "$IMAGE" == ghcr.io/* ]]; then
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
        fi
        docker pull --quiet "$IMAGE"

    - name: Build the video
      id: build
      shell: bash
      env:
        ELEVENLABS_API_KEY: ${{ inputs.elevenlabs-api-key }}
        IMAGE: ${{ inputs.image }}
        SOURCE: ${{ inputs.source-path }}
        OUTPUT: ${{ inputs.output }}
        TTS: ${{ inputs.tts }}
        SUBTITLES: ${{ inputs.subtitles }}
        TRANSCRIPT: ${{ inputs.transcript }}
      run: |
        cache="$HOME/.cache/narrate-image"
        mkdir -p "$cache" "$(dirname "$OUTPUT")"
        extra=()
        if [ -n "$SUBTITLES" ]; then extra+=(--subtitles "$SUBTITLES"); fi
        if [ "$TRANSCRIPT" = "true" ]; then extra+=(--transcript); fi
        docker run --rm --user "$(id -u):$(id -g)" \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" -v "$cache:/cache" \
          -e ELEVENLABS_API_KEY "$IMAGE" build "$SOURCE" -o "$OUTPUT" --tts "$TTS" "${extra[@]}"
        base="${OUTPUT%.*}"
        echo "video-file=$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "poster-file=$base.jpg" >> "$GITHUB_OUTPUT"
        if [ -f "$base.srt" ]; then echo "srt-file=$base.srt" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$base.vtt" ]; then echo "vtt-file=$base.vtt" >> "$GITHUB_OUTPUT"; fi
        if [ -f "$base.transcript.txt" ]; then echo "transcript-file=$base.transcript.txt" >> "$GITHUB_OUTPUT"; fi
