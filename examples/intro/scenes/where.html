<!doctype html>
<!-- Where it runs: each place appears as it's named. -->
<link rel="stylesheet" href="common.css">
<style>
  .grid { position: absolute; left: 150px; right: 150px; top: 200px; display: grid;
          grid-template-columns: repeat(2, 1fr); gap: 36px 40px; }
  .card { flex-direction: row; align-items: center; gap: 36px; padding: 40px 46px; }
  .card h3 { font-size: 46px; }
  .card code { font-family: var(--mono); font-size: 28px; color: var(--amber); }
  svg { stroke: var(--teal); fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .narakeet { position: absolute; left: 150px; top: 780px; font-size: 38px; color: var(--mute); }
  .narakeet b { color: var(--fg); }
</style>
<body>
  <div class="kicker up" style="position: absolute; left: 150px; top: 110px; animation-delay: .2s">Runs where you work</div>
  <div class="grid">
    <div class="card up" style="animation-delay: var(--cue-cli, .5s)">
      <svg viewBox="0 0 96 96"><rect x="8" y="14" width="80" height="68" rx="8"/><path d="M22 38l14 10-14 10M44 62h24"/></svg>
      <div><h3>The command line</h3><code>narrate build intro.md</code></div></div>
    <div class="card up" style="animation-delay: var(--cue-docker, 1.5s)">
      <svg viewBox="0 0 96 96"><rect x="10" y="40" width="76" height="40" rx="6"/><path d="M22 40V28h14v12M40 40V20h14v20M58 40V28h14v12"/></svg>
      <div><h3>Docker</h3><code>ghcr.io/bricef/narrate</code></div></div>
    <div class="card up" style="animation-delay: var(--cue-actions, 2.5s)">
      <svg viewBox="0 0 96 96"><circle cx="24" cy="24" r="10"/><circle cx="24" cy="72" r="10"/><circle cx="72" cy="48" r="10"/><path d="M24 34v28M32 30l30 14"/></svg>
      <div><h3>GitHub Actions</h3><code>a video in every release</code></div></div>
    <div class="card up" style="animation-delay: var(--cue-api, 3.5s)">
      <svg viewBox="0 0 96 96"><path d="M30 26 12 48l18 22M66 26l18 22-18 22"/><circle cx="48" cy="48" r="6"/></svg>
      <div><h3>An HTTP API</h3><code>each build's cost on record</code></div></div>
  </div>
  <div class="narakeet fade" style="animation-delay: var(--cue-narakeet, 6s)">It reads <b>Narakeet's</b> script format, too.</div>
</body>
