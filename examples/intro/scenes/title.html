<!doctype html>
<!-- The opening: narrate's name typed out, as a script is, then what it does. -->
<link rel="stylesheet" href="common.css">
<style>
  .name { font-family: var(--mono); font-size: 210px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; }
  .typed { display: inline-block; white-space: nowrap; overflow: hidden; width: 0;
           animation: type 1.1s steps(7) .3s forwards; }
  @keyframes type { to { width: 7ch; } }
  .caret { display: inline-block; width: 26px; height: 190px; margin-left: 14px; background: var(--amber);
           animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tag { font-size: 60px; margin-top: 40px; display: flex; gap: 34px; }
  .tag span:nth-child(1) { animation-delay: 1.6s; }
  .tag span:nth-child(2) { animation-delay: 2.0s; }
  .tag span:nth-child(3) { animation-delay: 2.4s; color: var(--amber); }
  .file { position: absolute; left: 150px; top: 110px; font-family: var(--mono); font-size: 32px; color: var(--mute); }
</style>
<body><div class="wrap">
  <div class="file fade" style="animation-delay: 1.2s">examples/intro/intro.md</div>
  <div class="name"><span class="typed">narrate</span><span class="caret"></span></div>
  <div class="tag"><span class="up">Write it.</span><span class="up">Build it.</span><span class="up">Watch it.</span></div>
</div></body>
