<!doctype html>
<!-- The opening: complete from its first frame, which players and platforms show as the video's cover.
     Only the caret moves, as if the name had just been typed. -->
<link rel="stylesheet" href="common.css">
<style>
  .name { font-family: var(--mono); font-size: 210px; font-weight: 700; letter-spacing: -.02em; display: flex; align-items: center; }
  .caret { display: inline-block; width: 26px; height: 190px; margin-left: 14px; background: var(--amber);
           animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .tag { font-size: 60px; margin-top: 40px; display: flex; gap: 34px; }
  .tag span:nth-child(3) { color: var(--amber); }
  .file { position: absolute; left: 150px; top: 110px; font-family: var(--mono); font-size: 32px; color: var(--mute); }
  .url { position: absolute; left: 150px; bottom: 110px; font-family: var(--mono); font-size: 40px; color: var(--mute); }
  .url b { color: var(--fg); font-weight: 400; }
</style>
<body><div class="wrap">
  <div class="file">examples/intro/intro.md</div>
  <div class="name"><span>narrate</span><span class="caret"></span></div>
  <div class="tag"><span>Write it.</span><span>Build it.</span><span>Watch it.</span></div>
  <div class="url">github.com/<b>bricef/narrate</b></div>
</div></body>
