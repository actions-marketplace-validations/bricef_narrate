<!doctype html>
<!-- The usual way: a recording, clips dragged along a timeline, and everything shifting when one thing changes. -->
<link rel="stylesheet" href="common.css">
<style>
  .editor { position: absolute; left: 150px; right: 150px; top: 250px; height: 560px; background: var(--panel);
            border: 2px solid var(--line); border-radius: 22px; padding: 46px 50px; }
  .track { position: relative; height: 96px; margin-bottom: 34px; border-bottom: 2px dashed var(--line); }
  .label { position: absolute; left: 0; top: 30px; font-size: 28px; color: var(--mute); width: 170px; }
  .clip { position: absolute; top: 12px; height: 72px; border-radius: 12px; }
  .v { background: #3b5b8c; } .a { background: #4f8c6a; } .t { background: #8c6a3b; }
  /* When something changes, everything after it has to move */
  .shift { animation: shift 1.4s ease-in-out forwards; animation-delay: var(--cue-change, 4.5s); }
  @keyframes shift { 30% { transform: translateX(60px) rotate(1deg); } 60% { transform: translateX(-40px); }
                     to { transform: translateX(150px); opacity: .45; } }
  .wave { position: absolute; top: 22px; height: 52px; left: 170px; right: 0;
          background: repeating-linear-gradient(90deg, #4f8c6a 0 6px, transparent 6px 14px); border-radius: 8px; opacity: .8; }
  .again { position: absolute; right: 190px; top: 170px; font-size: 64px; font-weight: 800; color: var(--rose);
           border: 6px solid var(--rose); border-radius: 18px; padding: 10px 28px; transform: rotate(-8deg);
           opacity: 0; animation: stamp .35s cubic-bezier(.2, .9, .3, 1.4) forwards;
           animation-delay: calc(var(--cue-change, 4.5s) + .7s); }
  @keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(1.6); } to { opacity: 1; transform: rotate(-8deg); } }
  .rec { position: absolute; left: 150px; top: 130px; font-size: 34px; display: flex; gap: 16px; align-items: center; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--rose); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
<body>
  <div class="rec fade" style="animation-delay: .2s"><span class="dot"></span><span class="mute">Recording voice-over… take 7</span></div>
  <div class="editor fade" style="animation-delay: var(--cue-timeline, 1.5s)">
    <div class="track"><span class="label">Video</span>
      <div class="clip v" style="left: 170px; width: 420px"></div>
      <div class="clip v shift" style="left: 610px; width: 360px"></div>
      <div class="clip v shift" style="left: 990px; width: 470px"></div></div>
    <div class="track"><span class="label">Voice</span><div class="wave shift"></div></div>
    <div class="track"><span class="label">Titles</span>
      <div class="clip t" style="left: 300px; width: 220px"></div>
      <div class="clip t shift" style="left: 760px; width: 260px"></div>
      <div class="clip t shift" style="left: 1180px; width: 200px"></div></div>
    <div class="track" style="border: 0"><span class="label">Music</span>
      <div class="clip a" style="left: 170px; width: 1290px; opacity: .6"></div></div>
  </div>
  <div class="again">Start over</div>
</body>
