<!doctype html>
<!-- Plain HTTP: the request is a postcard. It passes three hops, each named as it's said; eyes open over them on
     "read", and halfway along the postcard is rewritten, on "change", before it carries on to the server. -->
<link rel="stylesheet" href="common.css">
<style>
  .hop { position: absolute; top: 395px; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
         color: var(--mute); background: var(--panel); border: 3px solid var(--line); }
  .hop svg { width: 60px; height: 60px; }
  .hop span { position: absolute; top: 136px; width: 300px; left: -90px; text-align: center; font-size: 28px; color: var(--mute); }
  .eye { position: absolute; top: 270px; width: 96px; height: 60px; color: var(--eve); }
  .eye svg { width: 96px; height: 60px; stroke-width: 6; }
  /* The postcard, in two legs: to the middle hop, then on to the server */
  .leg1 { position: absolute; left: 40px; top: 650px; --to: 720px; }
  .leg2 { animation: leg 2.2s cubic-bezier(.45, 0, .3, 1) forwards; animation-delay: calc(var(--cue-change, 14.2s) + 1.3s); --to: 660px; }
  @keyframes leg { to { transform: translateX(var(--to)); } }
  .postcard { width: 400px; padding: 24px 30px; background: #f4efe4; color: #2b2a33; border-radius: 10px; transform: rotate(-2deg);
              font-family: var(--mono); font-size: 30px; line-height: 1.5; box-shadow: 0 20px 50px rgba(0, 0, 0, .5); position: relative; }
  .postcard .verb { color: #6b6a78; font-size: 26px; }
  .postcard .stamp { position: absolute; right: 18px; top: 16px; padding: 4px 12px; border: 3px dashed #b0574f; color: #b0574f;
                     font-size: 22px; font-weight: 700; transform: rotate(6deg); }
  .line { position: relative; height: 45px; }
  .line > span { position: absolute; left: 0; top: 0; white-space: nowrap; }
  .was { animation: out .25s forwards; animation-delay: var(--cue-change, 14.2s); }
  .now { opacity: 0; color: #c0392b; font-weight: 700; animation: fade .3s forwards; animation-delay: calc(var(--cue-change, 14.2s) + .2s); }
  .tamper { animation: shake .5s ease-in-out; animation-delay: var(--cue-change, 14.2s); }
  @keyframes shake { 20%, 60% { transform: rotate(-2deg) translateX(-10px); } 40%, 80% { transform: rotate(-2deg) translateX(10px); } }
  .caption { position: absolute; left: 150px; top: 880px; font-size: 40px; color: var(--mute); }
  .caption b { color: var(--eve); font-weight: 600; }
</style>
<body>
  <div class="kicker fade" style="animation-delay: .1s">Plain HTTP</div>

  <div class="wire" style="left: 315px; width: 1290px; top: 453px"></div>
  <div class="actor you" style="left: 130px; top: 380px">
    <div class="tile"><svg class="i" viewBox="0 0 96 96"><rect x="8" y="16" width="80" height="64" rx="8"/><path d="M8 34h80"/>
      <circle cx="20" cy="25" r="2"/><circle cx="30" cy="25" r="2"/><path d="M22 52h40M22 64h26"/></svg></div>
    <b>Your browser</b></div>
  <div class="actor server" style="left: 1570px; top: 380px">
    <div class="tile"><svg class="i" viewBox="0 0 96 96"><rect x="14" y="10" width="68" height="22" rx="5"/><rect x="14" y="37" width="68" height="22" rx="5"/>
      <rect x="14" y="64" width="68" height="22" rx="5"/><path d="M26 21h1M26 48h1M26 75h1M58 21h14M58 48h14M58 75h14"/></svg></div>
    <b>bank.example</b></div>

  <div class="hop pop" style="left: 540px; animation-delay: var(--cue-cafe, 5.6s)">
    <svg class="i" viewBox="0 0 96 96"><path d="M10 40a54 54 0 0 1 76 0M24 55a34 34 0 0 1 48 0M37 69a15 15 0 0 1 22 0"/><path d="M48 81h1"/></svg>
    <span>Café Wi-Fi</span></div>
  <div class="hop pop" style="left: 900px; animation-delay: var(--cue-isp, 6.8s)">
    <svg class="i" viewBox="0 0 96 96"><path d="M12 86h72M18 86V40l30-22 30 22v46M34 86V60h28v26M36 44h24"/></svg>
    <span>Internet provider</span></div>
  <div class="hop pop" style="left: 1260px; animation-delay: var(--cue-net, 8.3s)">
    <svg class="i" viewBox="0 0 96 96"><circle cx="48" cy="48" r="36"/><path d="M12 48h72M48 12c-14 12-14 60 0 72M48 12c14 12 14 60 0 72"/></svg>
    <span>Other networks</span></div>

  <div class="eye pop" style="left: 552px; animation-delay: var(--cue-read, 11.5s)">
    <svg class="i" viewBox="0 0 96 60"><path d="M4 30s18-26 44-26 44 26 44 26-18 26-44 26S4 30 4 30z"/><circle cx="48" cy="30" r="11"/></svg></div>
  <div class="eye pop" style="left: 912px; animation-delay: calc(var(--cue-read, 11.5s) + .25s)">
    <svg class="i" viewBox="0 0 96 60"><path d="M4 30s18-26 44-26 44 26 44 26-18 26-44 26S4 30 4 30z"/><circle cx="48" cy="30" r="11"/></svg></div>
  <div class="eye pop" style="left: 1272px; animation-delay: calc(var(--cue-read, 11.5s) + .5s)">
    <svg class="i" viewBox="0 0 96 60"><path d="M4 30s18-26 44-26 44 26 44 26-18 26-44 26S4 30 4 30z"/><circle cx="48" cy="30" r="11"/></svg></div>

  <div class="leg1 fade" style="animation: fade .5s forwards .3s, leg 2.2s cubic-bezier(.45, 0, .3, 1) var(--cue-read, 11.5s) forwards">
    <div class="leg2"><div class="tamper"><div class="postcard">
      <span class="stamp">HTTP</span>
      <div class="verb">POST /transfer</div>
      <div class="line"><span class="was">to=Sam&amp;amount=20</span><span class="now">to=Max&amp;amount=900</span></div>
    </div></div></div></div>

  <div class="caption fade" style="animation-delay: var(--cue-read, 11.5s)">Anyone on the path can read it<span class="fade" style="animation-delay: var(--cue-change, 14.2s)">, <b>or change it</b>.</span></div>
</body>
