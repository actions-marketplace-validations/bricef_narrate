<!doctype html>
<!-- The three promises, each appearing as it's said, with the name security people give it. -->
<link rel="stylesheet" href="common.css">
<style>
  .row { position: absolute; left: 150px; right: 150px; top: 230px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; }
  .card { height: 600px; padding: 56px 50px; display: flex; flex-direction: column; gap: 30px; }
  .card .tile { width: 140px; height: 140px; border-radius: 34px; border: 3px solid currentColor; display: grid; place-items: center;
                background: color-mix(in srgb, currentColor 13%, var(--panel)); }
  .card .tile svg { width: 80px; height: 80px; }
  .card h3 { margin: 0; font-size: 64px; font-weight: 800; color: var(--fg); }
  .card p { margin: 0; font-size: 36px; line-height: 1.35; color: var(--mute); }
  .card .tag { margin-top: auto; font-family: var(--mono); font-size: 26px; }
</style>
<body>
  <div class="kicker fade" style="animation-delay: .1s">What HTTPS promises</div>
  <div class="row">
    <div class="card pop key" style="animation-delay: var(--cue-private, 1.8s)">
      <div class="tile"><svg class="i" viewBox="0 0 96 96"><path d="M6 48s16-26 42-26 42 26 42 26-16 26-42 26S6 48 6 48z"/>
        <circle cx="48" cy="48" r="11"/><path d="M16 16l64 64"/></svg></div>
      <h3>Private</h3><p>Nobody else can read what you send.</p><span class="tag">confidentiality</span></div>
    <div class="card pop ok" style="animation-delay: var(--cue-intact, 4.2s)">
      <div class="tile"><svg class="i" viewBox="0 0 96 96"><path d="M48 8 80 20v26c0 20-14 34-32 42-18-8-32-22-32-42V20z"/>
        <path d="M34 48l10 10 18-20"/></svg></div>
      <h3>Intact</h3><p>Nobody can change it without being caught.</p><span class="tag">integrity</span></div>
    <div class="card pop server" style="animation-delay: var(--cue-authentic, 7s)">
      <div class="tile"><svg class="i" viewBox="0 0 96 96"><rect x="10" y="20" width="76" height="56" rx="8"/><circle cx="34" cy="43" r="9"/>
        <path d="M20 66c2-7 8-10 14-10s12 3 14 10M58 40h18M58 54h12"/></svg></div>
      <h3>Authentic</h3><p>The site really is the one you asked for.</p><span class="tag">authentication</span></div>
  </div>
</body>
